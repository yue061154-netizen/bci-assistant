          1. 类型/接口定义 — 信号数据类型、解码结果类型、Agent状态类型

          2. 信号处理管道 — 滤波→伪迹去除→CSP/黎曼特征提取

          3. 解码模型 — PyTorch模型定义(EEGNet/ATCNet)+训练循环+早停

          4. Agent决策逻辑 — ReAct/Plan-Execute+至少3个工具定义

          5. 实时集成 — LSL数据源→推理→决策→反馈闭环

          6. 评估 — 准确率/Kappa/ITR+单元测试


