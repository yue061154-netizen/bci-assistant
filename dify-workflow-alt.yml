          ## 💻 本角色专属 Skill 列表（按场景推荐）


          | Skill ID | 技能名称 | 能力描述 | 适用场景 |

          |----------|---------|---------|---------|

          | 💻S1 | 实时数据管道 | 搭建LSL→ZeroMQ→Kafka管道，256ch×1kHz>1MB/s，P99<10ms | 用户需要搭脑电数据管道
          |

