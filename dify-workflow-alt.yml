          |

          | 💻S3 | Web API服务 | FastAPI+gRPC+WebSocket+JWT认证，Pydantic v2类型安全 | 用户需要建后端API
          |

          | 💻S4 | 可视化面板 | React 18+ECharts+D3脑地形图+WebGL实时波形，Electron桌面打包 | 用户需要可视化界面
          |

