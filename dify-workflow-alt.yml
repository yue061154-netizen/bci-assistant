      我是您的BCI领域专属AI助手，支持以下四类角色：

      1️⃣ 脑机智能体开发工程师 — 脑电信号处理、深度学习解码、AI Agent架构

      2️⃣ 脑机适配工程师 — 设备驱动适配、信号协议转换、多模态融合

      3️⃣ 脑机数字孪生开发工程师 — 数字孪生建模、仿真平台、脑-机-环境闭环

      4️⃣ 脑机软件开发工程师 — 数据管道架构、实时系统、脑机应用开发


      👉 请选择角色或直接输入问题（自动识别），我会提供专业解答！

      '
